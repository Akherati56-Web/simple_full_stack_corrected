apiVersion: apps/v1
kind: DaemonSet
metadata:
 name: fluentd
spec:
 selector:
    matchLabels:
      app: fluentd
 replicas: 0
 template:
    metadata:
      labels:
        app: fluentd
    spec:
      containers:
      - name: fluentd
        image: fluent/fluentd-kubernetes-daemonset:v1.7.4
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: config-volume
          mountPath: /fluentd/etc
      resources:
          limits:
            memory: "300Mi"
            cpu: "50m"
      terminationGracePeriodSeconds: 30
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: config-volume
        configMap:
          name: fluentd-config
---
apiVersion: v1
kind: ConfigMap
metadata:
 name: fluentd-config
data:
 fluent.conf: |
    <source>
     @type tail
     path /var/log/containers/*.log
     pos_file /var/log/es-containers.log.pos
     time_format %Y-%m-%dT%H:%M:%S.%NZ
     tag kubernetes.*
     format json
     read_from_head true
    </source>

    <match kubernetes.**>
     @type elasticsearch
     host elasticsearch-master
     port 9200
     logstash_format true
     logstash_prefix kubernetes
     logstash_dateformat %Y.%m.%d
     flush_interval 5s
    </match>
