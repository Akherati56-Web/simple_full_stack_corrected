apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-object
spec:
  rules:
  - host: akherati5660.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginxreact-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: nginxphp-service
            port:
              number: 80
    