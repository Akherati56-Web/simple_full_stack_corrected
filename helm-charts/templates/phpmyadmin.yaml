apiVersion: apps/v1
kind: Deployment
metadata:
 name: phpmyadmin
spec:
 selector:
    matchLabels:
      app: phpmyadmin
 replicas: 1
 template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin/phpmyadmin
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
 name: phpmyadmin
spec:
 selector:
    app: phpmyadmin
 ports:
    - protocol: TCP
      port: 80
      targetPort: 80
 type: LoadBalancer