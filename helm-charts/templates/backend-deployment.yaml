apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.replicas.backend }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.images.backend }}:{{ .Values.tag.backend }}"
          ports:
            - containerPort: 9000
          imagePullPolicy: Always
          resources:
            limits:
              memory: {{ .Values.memory.backend }}
              cpu: {{ .Values.cpu.backend }}
      imagePullSecrets:
        - name: key
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - name: backend
      port: 9000
      targetPort: 9000
