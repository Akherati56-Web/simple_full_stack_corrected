apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.replicas.main }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: registry.gitlab.com/akherati5660/bookstore/backend:latest
          ports:
            - containerPort: 9000
          imagePullPolicy: Always
          resources:
            limits:
              memory: "300Mi"
              cpu: "100m"
      imagePullSecrets:
        - name: key
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - name: backend
      port: 9000
      targetPort: 9000
