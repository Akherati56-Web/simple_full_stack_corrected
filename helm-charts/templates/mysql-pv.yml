apiVersion: v1
kind: PersistentVolume
metadata:
 name: mysql-pv-volume
spec:
 accessModes:
    - ReadWriteOnce
 capacity:
    storage: 1Gi
 persistentVolumeReclaimPolicy: Retain
 storageClassName: localstorage
 local:
    path: /mnt/data
 nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - my-node