apiVersion: apps/v1
kind: Deployment
metadata:
 name: elasticsearch
spec:
 replicas: 1
 selector:
    matchLabels:
      app: elasticsearch
 template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:7.13.2
        ports:
        - containerPort: 9200
        - containerPort: 9300
        resources:
          limits:
            cpu: 500m
          requests:
            cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
 name: elasticsearch
spec:
 selector:
    app: elasticsearch
 ports:
    - protocol: TCP
      port: 9200
      targetPort: 9200
    - protocol: TCP
      port: 9300
      targetPort: 9300
 type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: kibana
spec:
 replicas: 1
 selector:
    matchLabels:
      app: kibana
 template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:7.13.2
        ports:
        - containerPort: 5601
        resources:
          limits:
            cpu: 500m
          requests:
            cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
 name: kibana
spec:
 selector:
    app: kibana
 ports:
    - protocol: TCP
      port: 5601
      targetPort: 5601
 type: LoadBalancer
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
 name: fluentd
spec:
 selector:
    matchLabels:
      app: fluentd
 template:
    metadata:
      labels:
        app: fluentd
    spec:
      containers:
      - name: fluentd
        image: fluent/fluentd-kubernetes-daemonset:v1.11.1
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: config-volume
          mountPath: /fluentd/etc
      terminationGracePeriodSeconds: 30
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: config-volume
        configMap:
          name: fluentd-config
---
apiVersion: v1
kind: ConfigMap
metadata:
 name: fluentd-config
data:
 fluent.conf: |
    <source>
     @type tail
     path /var/log/containers/*.log
     pos_file /var/log/es-containers.log.pos
     time_format %Y-%m-%dT%H:%M:%S.%NZ
     tag kubernetes.*
     format json
     read_from_head true
    </source>

    <match kubernetes.**>
     @type elasticsearch
     host elasticsearch-master
     port 9200
     logstash_format true
     logstash_prefix kubernetes
     logstash_dateformat %Y.%m.%d
     flush_interval 5s
    </match>