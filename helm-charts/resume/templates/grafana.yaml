apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/akherati56/simple_full_stack_corrected
    targetRevision: main
    path: helm-charts/grafana/
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy: 
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: false
      prune: false