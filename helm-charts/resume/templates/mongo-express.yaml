apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
spec:
  replicas: {{ .Values.replicas.mongo-express }}
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
        - name: mongo-express
          image: "{{ .Values.images.mongo-express }}:{{ .Values.tag.mongo-express }}"
          ports:
            - containerPort: 8081
          imagePullPolicy: Always
          resources:
            limits:
              memory: {{ .Values.memory.mongo-express }}
              cpu: {{ .Values.cpu.mongo-express }}
      imagePullSecrets:
        - name: key
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express-service
spec:
  selector:
    app: mongo-express
  ports:
    - name: mongo-express
      port: 8081
      targetPort: 8081
