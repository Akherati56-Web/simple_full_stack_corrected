apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
spec:
  replicas: {{ .Values.replicas.redisinsight }}
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
    spec:
      containers:
        - name: redisinsight
          image: "{{ .Values.images.redisinsight }}:{{ .Values.tag.redisinsight }}"
          ports:
            - containerPort: 8001
          env:
            - name: RIPROXYENABLE  
              value: "true"
            - name: RILOGLEVEL
              value: "DEBUG"
          imagePullPolicy: Always
          resources:
            limits:
              memory: {{ .Values.memory.redisinsight }}
              cpu: {{ .Values.cpu.redisinsight }}
      imagePullSecrets:
        - name: key
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight-service
spec:
  selector:
    app: redisinsight
  type: NodePort
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
      nodePort: 30011
