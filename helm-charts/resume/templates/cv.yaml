apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv
  labels:
    app: cv
spec:
  replicas: {{ .Values.replicas.cv }}
  selector:
    matchLabels:
      app: cv
  template:
    metadata:
      labels:
        app: cv
    spec:
      containers:
        - name: cv
          image: "{{ .Values.images.cv }}:{{ .Values.tag.cv }}"
          ports:
            - containerPort: 80
          imagePullPolicy: Always
          resources:
            limits:
              memory: {{ .Values.memory.cv }}
              cpu: {{ .Values.cpu.cv }}
      imagePullSecrets:
        - name: key
---
apiVersion: v1
kind: Service
metadata:
  name: cv-service
spec:
  selector:
    app: cv
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30005
