apiVersion: apps/v1
kind: Deployment
metadata:
 name: elasticsearch
spec:
 selector:
    matchLabels:
      app: elasticsearch
 replicas: 1
 template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:7.6.2
        ports:
        - name: http
          containerPort: 9200
        - name: transport
          containerPort: 9300
        resources:
          limits:
            memory: "300Mi"
            cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
 name: elasticsearch
spec:
 selector:
    app: elasticsearch
 ports:
    - name: http
      protocol: TCP
      port: 9200
      targetPort: 9200
    - name: transport
      protocol: TCP
      port: 9300
      targetPort: 9300
 type: ClusterIP