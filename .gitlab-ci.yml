build_image:
    before_script:
        ##
        ## Install ssh-agent if not already installed, it is required by Docker.
        ## (change apt-get to yum if you use an RPM-based image)
        ##
        - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'

        ##
        ## Run ssh-agent (inside the build environment)
        ##
        - eval $(ssh-agent -s)

        ##
        ## Give the right permissions, otherwise ssh-add will refuse to add files
        ## Add the SSH key stored in SSH_PRIVATE_KEY file type CI/CD variable to the agent store
        ##
        - chmod 400 "$SSH_KEY"
        - ssh-add "$SSH_KEY"

        ##
        ## Create the SSH directory and give it the right permissions
        ##
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh

        ##
        ## Optionally, if you will be using any Git commands, set the user name and
        ## and email.
        ##
        # - git config --global user.email "user@example.com"
        # - git config --global user.name "User name"
    script:
        - ssh -o StrictHostKeyChecking=no -i root@149.100.156.119 "
            docker login registry.gitlab.com -u $REGISTRY_USER -p $REGISTRY_PASS &&
            docker run registry.gitlab.com/akherati5660/bookstore/nginx-php "



deploy:
    stage: deploy
    image: docker:20.10.16
    services:
        - docker:20.10.16-dind
    variables:
        DOCKER_TLS_CERTDIR: "/certs"
    before_script:
        - docker login registry.gitlab.com -u $REGISTRY_USER -p $REGISTRY_PASS
    script:
        - docker build -t registry.gitlab.com/akherati5660/bookstore/nginx-php ./backend/
        - docker push registry.gitlab.com/akherati5660/bookstore/nginx-php
        - docker build -t registry.gitlab.com/akherati5660/bookstore/nginx-node ./frontend/
        - docker push registry.gitlab.com/akherati5660/bookstore/nginx-node
        - docker build -t registry.gitlab.com/akherati5660/bookstore/frontend ./frontend/vite_project
        - docker push registry.gitlab.com/akherati5660/bookstore/frontend
        - docker build -t registry.gitlab.com/akherati5660/bookstore/backend ./backend/BookStore
        - docker push registry.gitlab.com/akherati5660/bookstore/backend
