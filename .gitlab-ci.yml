build_image:
    before_script:
        - chmod 400 $SSH_KEY
    script:
        - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@149.100.156.119 "
            docker login registry.gitlab.com -u $REGISTRY_USER -p $REGISTRY_PASS &&
            docker run registry.gitlab.com/akherati5660/bookstore/nginx-php "



deploy:
    stage: deploy
    image: docker:20.10.16
    services:
        - docker:20.10.16-dind
    variables:
        DOCKER_TLS_CERTDIR: "/certs"
    before_script:
        - docker login registry.gitlab.com -u $REGISTRY_USER -p $REGISTRY_PASS
    script:
        - docker build -t registry.gitlab.com/akherati5660/bookstore/nginx-php ./backend/
        - docker push registry.gitlab.com/akherati5660/bookstore/nginx-php
        - docker build -t registry.gitlab.com/akherati5660/bookstore/nginx-node ./frontend/
        - docker push registry.gitlab.com/akherati5660/bookstore/nginx-node
        - docker build -t registry.gitlab.com/akherati5660/bookstore/frontend ./frontend/vite_project
        - docker push registry.gitlab.com/akherati5660/bookstore/frontend
        - docker build -t registry.gitlab.com/akherati5660/bookstore/backend ./backend/BookStore
        - docker push registry.gitlab.com/akherati5660/bookstore/backend
