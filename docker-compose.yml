version: '3.8'
services:
  frontend:
    container_name: node
    build:
        context: ./docker/node
        dockerfile: Dockerfile
    volumes:
      - ./frontend/vite_project:/vite_project
    
  database:
    container_name: mysql
    image: mysql:5.7.37
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '1234'
      MYSQL_DATABASE: bookstore
      MYSQL_USER: user
      MYSQL_PASSWORD: '1234'
    ports:
      - "3309:3306" 
    
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - '8080:80'
    restart: always
    environment:
      PMA_HOST: database
    depends_on:
      - database 
 
  navicat:
    image: navicat/navicatmonitor:3.0.1
    ports:
      - '3000:3000'
    depends_on:
      - database
    network_mode: "host"
    
  server:
    container_name: nginx
    build: ./docker/nginx
    command: nginx -g "daemon off;"
    links:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./logs/nginx:/var/log/nginx
      - ./backend/BookStore:/var/www/html/BookStore
      
  backend:
    container_name: php
    build: ./docker/php
    ports:
      - "9000:9000"
    volumes:
      - ./backend/BookStore:/var/www/html/BookStore
    working_dir: /var/www/html/BookStore

  composer:
    container_name: composer
    image: composer/composer
    volumes:
      - ./backend/BookStore:/var/www/html/BookStore
    working_dir: /var/www/html/BookStore
    command: install