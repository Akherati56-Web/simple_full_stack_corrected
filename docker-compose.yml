version: "3.8"
services:
  frontend-service:
    container_name: frontend-service
    build:
      context: ./frontend/vite_project
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    working_dir: /vite_project
    volumes:
      - ./frontend/vite_project:/vite_project

  nginx_react:
    container_name: nginx_react
    build: ./frontend
    command: nginx -g "daemon off;"
    links:
      - frontend-service
    ports:
      - "82:80"
    volumes:
      - ./logs/nginx-react:/var/log/nginx
      - ./frontend/vite_project:/var/www/html/vite_project

  nginx_php:
    container_name: nginx_php
    build: ./backend
    command: nginx -g "daemon off;"
    links:
      - backend-service
    ports:
      - "81:80"
    volumes:
      - ./logs/nginx-php:/var/log/nginx
      - ./backend/BookStore:/var/www/html/BookStore

  nginx:
    container_name: nginx
    build: ./server
    command: nginx -g "daemon off;"
    links:
      - backend-service
      - frontend-service
    ports:
      - "80:80"
    depends_on:
      - nginx_php
      - nginx_react
    volumes:
      - ./logs/nginx:/var/log/nginx

  backend-service:
    container_name: backend-service
    build: ./backend/BookStore
    ports:
      - "9000:9000"
    volumes:
      - ./backend/BookStore:/var/www/html/BookStore
    working_dir: /var/www/html/BookStore

  websocket-service:
    container_name: websocket-service
    build: ./websocket
    ports:
      - "8080:8080"
    volumes:
      - ./websocket:/app
    working_dir: /app
    depends_on:
      - redis-database

  ai-service:
    container_name: ai-service
    build: ./ai-api
    ports:
      - "8088:8088"
    volumes:
      - ./ai-api:/app
    working_dir: /app
    depends_on:
      - mongo-database

  database-service:
    container_name: database-service
    image: mysql:5.7.37
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bookstore
    ports:
      - "3309:3306"
    volumes:
      - ./database:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8090:80"
    restart: always
    environment:
      PMA_HOST: database-service
    depends_on:
      - database-service

  navicat:
    image: navicat/navicatmonitor:3.0.1
    ports:
      - "3000:3000"
    depends_on:
      - database-service
    network_mode: "host"

  redis-database:
    container_name: redis-database
    image: redis:latest
    ports:
      - "6379:6379"

  mongo-database:
    container_name: mongo-database
    image: mongo:latest
    ports:
      - "27017:27017"

  postgres-database:
    container_name: postgres-database
    image: postgres:latest
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: ${PG_ADMIN_PASS}

  pgadmin-service:
    container_name: pgadmin-service
    image: dpage/pgadmin4:latest
    ports:
      - 86:80
    environment:
      PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_PASS}
      PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_EMAIL}
    depends_on:
      - postgres-database
